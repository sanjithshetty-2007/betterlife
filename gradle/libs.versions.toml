serialization = "1.12.0"
# Supabase Kotlin client (checked on Maven Central and its release notes 2026-11-06: built with Kotlin 2.4.21, Ktor 3.6.0).
supabase = "3.9.0"
ktor = "3.6.0"
junit = "4.13.2"
