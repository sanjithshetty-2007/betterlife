# Memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Skips the configuration phase when build scripts have not changed.
org.gradle.configuration-cache=true
kotlin.code.style=official
# Keep the debug app installed after device tests. By default the test run uninstalls it, which wipes
# its data and the permissions granted on the phone.
android.injected.androidTest.leaveApksInstalledAfterRun=true
